data:
  train_batch_size: 256
  micro_batch_size: null # will be deprecated, use micro_batch_size_per_gpu
  micro_batch_size_per_gpu: 4  # this is also val batch size
  train_files: ~/data/gsm8k/train.parquet
  val_files: ~/data/gsm8k/test.parquet
  # Single-turn settings
  prompt_key: question
  response_key: answer
  prompt_dict_keys: null
  response_dict_keys: null
  # Multi-turn settings
  multiturn:
    enable: false  # Set to true to use multi-turn dataset
    messages_key: messages  # Key for messages list in multi-turn mode
    tools_key: tools  # Key for tools list in multi-turn mode
    enable_thinking_key: enable_thinking  # Whether to enable thinking in multi-turn mode
  max_length: 1024
  truncation: right
  balance_dp_token: False
  chat_template: null
  custom_cls:
    path: null
    name: null
  use_shm: False
model:
  partial_pretrain: ~/models/gemma-1.1-7b-it
  use_shm: False
  fsdp_config:
    model_dtype: fp32
    wrap_policy:
      min_num_params: 0
    cpu_offload: False
    offload_params: False
  external_lib: null
  enable_gradient_checkpointing: True
  trust_remote_code: False
  lora_rank: 0  # Set to positive value to enable LoRA (e.g., 32)
  lora_alpha: 16  # LoRA scaling factor
  target_modules: all-linear  # Target modules for LoRA adaptation
  use_liger: False
  strategy: fsdp2
optim:
  lr: 1e-5
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps_ratio: 0.1
  clip_grad: 1.0
  lr_scheduler: cosine
loss:
  # Token-weighting rule. One of {sft, dft, prift_prob, prift_mass}.
  #   sft         : standard token CE (m_t = 1)
  #   dft         : CE weighted by detached online target prob (m_t = sg(p_online(y_t)))
  #   prift_prob  : CE weighted by frozen-reference target prob (m_t = p_ref(y_t))
  #   prift_mass  : CE on tokens whose reference score
  #                 lower_mass_t + p_ref(y_t) >= mass_threshold, where
  #                 lower_mass_t = sum_v p_ref(v) * 1[p_ref(v) < p_ref(y_t)]
  method: dft
  # Path to the frozen pretrained reference model used by prift_*.
  # When null, defaults to model.partial_pretrain (the model's own pre-SFT checkpoint).
  reference_model_path: null
  # Selection threshold tau for prift_mass.
  mass_threshold: 0.5
  # Optional vocab-dim chunk size for the prift_mass lower-mass computation.
  # null computes over the full vocabulary at once; set a smaller value to bound
  # peak memory of the full-vocab softmax path.
  mass_vocab_chunk: null
  # Optional micro-batch size (in sequences) for the reference forward pass.
  # null means use the same micro batch as the online model.
  reference_micro_batch_size: null
ulysses_sequence_parallel_size: 1
use_remove_padding: False
trainer:
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}
  default_hdfs_dir: null
  resume_path: null
  project_name: gsm8k-sft
  experiment_name: test
  total_epochs: 4
  total_training_steps: null
  logger: [ 'console', 'wandb' ]
  seed: 1
  save_freq: -1
  test_freq: -1
  nnodes: 1
  n_gpus_per_node: 8
  max_ckpt_to_keep: null # TODO
